# Builds the Windows installer and the Mac .dmg files and publishes them as one GitHub Release
# when a version tag is pushed (npm version patch && git push origin main --follow-tags). The
# installed Windows programs find it there and update themselves; Macs are told it's out.
# The tag must match "version" in package.json.
#
# The screens are packaged from Volar-admin (mohaamedwasfy/volar-dashboard): it's private, so
# a token that can read it goes in the ADMIN_REPO_TOKEN secret.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # one job makes the release; the two builds only add their files to it (two builds each
  # making it once gave two releases with the same tag)
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: A token that can read volar-dashboard
        env:
          ADMIN_REPO_TOKEN: ${{ secrets.ADMIN_REPO_TOKEN }}
        run: |
          [ -n "$ADMIN_REPO_TOKEN" ] || { echo "::error::Add the ADMIN_REPO_TOKEN secret (Settings → Secrets and variables → Actions): a fine-grained token with read access to the contents of mohaamedwasfy/volar-dashboard."; exit 1; }
      - name: The tag matches package.json
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} but package.json says $v"; exit 1; }
      - run: node scripts/ensure-release.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis
          # Windows only for now. To bring the Mac builds back: `- os: macos-latest`, `args: --mac`
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: desktop
      - uses: actions/checkout@v4
        with:
          repository: mohaamedwasfy/volar-dashboard
          token: ${{ secrets.ADMIN_REPO_TOKEN }}
          path: admin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: admin
      - run: npm ci
        working-directory: desktop
      - run: npm run build:ui
        working-directory: desktop
        env:
          ADMIN_DIR: ../admin
      - run: npx electron-builder ${{ matrix.args }} --publish always
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # no Apple certificate here: don't go looking for one
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
